function svg(name){return `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${icon(name)}</svg>`}
function character(kind,skin,hair,shirt,skirt=false,gender='female'){const isTeacher=kind==='teacher',isParent=kind==='parent',male=gender==='male';const hairShape=male?'M35 76q1-39 27-40 22 0 27 24-14-2-22-14-11 12-31 13z':'M35 75q5-37 31-36 18 1 26 20-17-7-27-20-5 17-30 23z';const sideHair=male?'M35 73q-4 13 0 25l7-5V75M85 73q5 12 1 25l-8-5V75':'M36 75q-8 20-5 43l10-8 1-25M85 75q9 20 5 42l-9-8 1-23';return `<div class="character ${kind}" aria-hidden="true"><svg viewBox="0 0 120 290"><ellipse cx="60" cy="277" rx="32" ry="6" fill="#79927d" opacity=".16"/><path d="M45 235 43 268q-1 8 6 8h10l5-36M68 239l5 29q1 8 8 8h9q5-2 1-8l-9-39" fill="#43544c"/><path d="M45 272h14q5 0 6 5v4H39v-4q1-4 6-5M76 272h12q7 0 9 5v4H72v-4q0-4 4-5" fill="#fdfcf6"/><path d="M36 113q-9 9-9 32v57q2 13 13 13h40q12-2 12-14v-52q-1-25-14-36" fill="${shirt}"/><path d="M39 179h49l3 48H37z" fill="${skirt?'#586d82':'#46586f'}"/><path d="M49 113v26q11 9 22 0v-28" fill="${skin}"/><path d="M31 67q2-37 31-38 34 1 35 40l-4 35q-6 20-32 20-26-2-32-23z" fill="${hair}"/><ellipse cx="60" cy="82" rx="25" ry="31" fill="${skin}"/><path d="${hairShape}" fill="${hair}"/><path d="${sideHair}" fill="${hair}"/>${isParent&&male?'<path d="M41 81h19m0 0h19m-19 0v3" fill="none" stroke="#47544e" stroke-width="2"/>':''}${isTeacher&&!male?'<circle cx="88" cy="48" r="7" fill="'+hair+'"/>':''}<ellipse cx="51" cy="84" rx="2" ry="2.8" fill="#3b403a"/><ellipse cx="70" cy="84" rx="2" ry="2.8" fill="#3b403a"/><path d="M55 98q5 5 10 0" fill="none" stroke="#bd6e6c" stroke-width="2" stroke-linecap="round"/><circle cx="43" cy="95" r="4" fill="#f09993" opacity=".45"/><circle cx="78" cy="95" r="4" fill="#f09993" opacity=".45"/><path d="M40 126q20 13 39 0" fill="none" stroke="#ffffff" stroke-width="3" opacity=".65"/>${isTeacher?'<path d="m52 123 8 15 8-15" fill="#fff"/><path d="M54 143h12l-3 20h-6z" fill="#f0b85e"/>':''}<path d="M35 149q-13 15-15 33l8 4 17-24M84 150q14 13 16 31l-8 5-16-20" fill="${skin}"/><path d="M18 180q-5 0-5 6t7 5l9-3-1-7zM94 181q-4 2-4 7l8 5q8 0 8-6t-7-6" fill="${skin}"/></svg></div>`}
function header(){return `<header class="topbar"><button class="brand" data-action="home"><span class="brand-icon">${svg('school')}</span><span>${esc(data.school)} <small style="font-weight:500;color:#819087">우리반 알림장</small></span></button><div class="topbar-right"><span class="top-caption">마음이 오가는 우리 반 소식</span>${data.role?`<button class="mini-button logout-button" data-action="logout">나가기</button>`:''}</div></header>`}
function landing(){return `${header()}<main class="home-wrap"><section class="hero"><div class="hero-copy"><span class="eyebrow"><i class="eyebrow-dot"></i> 우리 반 소식, 한곳에서 편하게</span><h1>오늘도 반가워요,<br><em>우리 반 친구들!</em></h1><p>학교 소식부터 급식, 시간표와 상담 일정까지. 선생님과 가족이 함께 확인하는 따뜻한 우리 반 알림장이에요.</p><div class="hero-actions"><button class="primary-button" data-action="login">우리 반 입장하기 ${svg('plus')}</button><button class="outline-button" data-action="login">교사 포털</button></div><div class="class-note">학생·학부모는 학급 접속 코드와 학번, 이름으로 입장해요.</div></div><div class="hero-art"><div class="art-sun"></div><span class="art-cloud cloud-one">☁</span><span class="art-cloud cloud-two">☁</span><div class="characters">${character('teacher','#e9b895','#46382f','#82a9ce',false,'female')}${character('teacher','#d99d78','#493a32','#80a77c',false,'male')}${character('student','#eab894','#392f2c','#f0c36d',true,'female')}${character('student','#dca77f','#403632','#90b5cc',false,'male')}${character('parent','#e7b18e','#574339','#d98d9a',true,'female')}${character('parent','#d8a17e','#4a3b34','#8eaa8b',false,'male')}</div><div class="art-label">여교사 · 남교사 · 학생 · 학부모</div></div></section><section class="features"><article class="feature"><div class="feature-icon">${svg('bell')}</div><div><strong>놓치지 않는 우리 반 소식</strong><span>학생과 학부모에게 필요한 안내를 따로</span></div></article><article class="feature"><div class="feature-icon">${svg('calendar')}</div><div><strong>한눈에 보는 학교생활</strong><span>학사일정, 급식, 시간표를 모아서</span></div></article><article class="feature"><div class="feature-icon">${svg('heart')}</div><div><strong>따뜻하게 이어지는 상담</strong><span>편리하게 확인하는 상담 일정과 알림</span></div></article></section><section id="loginMount"></section><p class="footer-note">작은 소식도 함께 나누며, 즐거운 학교생활을 만들어가요.</p></main>`}
function loginForm(){return `<div class="login-shell"><section class="login-layout"><div class="login-intro"><span class="eyebrow"><i class="eyebrow-dot"></i> 안전한 우리 반 공간</span><div class="mini-illustration" aria-hidden="true">👩🏻‍🏫　🧒🏻　👨🏻‍👩🏻‍👧🏻</div><h2>우리 반에<br>오신 걸 환영해요!</h2><p>역할에 맞는 입장 방법을 선택하고 선생님이 전해주신 코드로 접속해 주세요.</p></div><div class="login-card"><h2>우리 반 입장하기</h2><p>어떤 계정으로 입장하시나요?</p><div class="role-tabs"><button class="tab-button active" data-role="student">학생</button><button class="tab-button" data-role="parent">학부모</button><button class="tab-button" data-role="teacher">교사 포털</button><button class="tab-button" data-role="admin">관리자</button></div><div class="login-mascot" id="loginMascot" aria-live="polite"></div><form class="form-grid" id="loginForm"></form></div></section></div>`}
function render(){const app=document.getElementById('app');if(!data.role){app.innerHTML=landing();const artwork=app.querySelector('.characters');if(artwork)artwork.innerHTML='<img class="community-characters" src="/ai-images/class-community-characters-framed.png" alt="여교사, 남교사, 여학생, 남학생, 어머니, 아버지 캐릭터" decoding="async">';const featureAssets=[['teacher-mascots.png','알림을 전하는 교사 캐릭터'],['student-mascots.png','학교생활을 확인하는 학생 캐릭터'],['parent-mascots.png','상담하는 학부모 캐릭터']];app.querySelectorAll('.feature-icon').forEach((slot,index)=>slot.innerHTML=`<img src="/ai-images/${featureAssets[index][0]}" alt="${featureAssets[index][1]}" loading="lazy">`);const access=app.querySelector('.hero-actions');if(access){access.classList.remove('access-actions');access.innerHTML='<button class="primary-button portal-entry" data-action="login" aria-controls="loginMount">우리학급 포털로 이동해요 <span aria-hidden="true">→</span></button>'}return}app.innerHTML=header()+dashboard();if(data.role==='teacher')app.querySelectorAll('[data-section="관리자 설정"]').forEach(button=>button.remove())}
let selectedRole='student';
function showLogin(){render();const mount=document.getElementById('loginMount');if(mount){mount.innerHTML=loginForm();mount.scrollIntoView({behavior:'smooth',block:'center'});renderLoginFields(selectedRole)}}
function renderLoginFields(role){selectedRole=role;document.querySelectorAll('.tab-button').forEach(b=>b.classList.toggle('active',b.dataset.role===role));const mascot=document.getElementById('loginMascot');const mascotInfo={student:['student-mascots.png','학생 캐릭터','학생으로 오셨군요!','학급 코드와 학번, 이름을 입력해 주세요.'],parent:['parent-mascots.png','학부모 캐릭터','학부모님, 반가워요!','학생의 학급 코드와 학번, 이름을 입력해 주세요.'],teacher:['teacher-mascots.png','교사 캐릭터','선생님, 환영합니다!','교사 포털 입장 코드를 입력해 주세요.']}[role];if(mascot)mascot.innerHTML=`<img src="/ai-images/${mascotInfo[0]}" alt="${mascotInfo[1]}" decoding="async"><span><strong>${mascotInfo[2]}</strong><small>${mascotInfo[3]}</small></span>`;if(mascot)mascot.className=`login-mascot mascot-${role}`;const form=document.getElementById('loginForm');if(!form)return;let fields='';if(role==='teacher')fields=`<div class="field"><label for="teacherCode">교사 포털 입장 코드</label><input id="teacherCode" name="code" placeholder="선생님 코드를 입력해 주세요" required autocomplete="one-time-code"><span class="field-hint">초기 시연 코드는 2468이며, 접속 후 관리자 설정에서 변경할 수 있어요.</span></div>`;else fields=`<div class="field"><label for="classCode">학급 접속 코드</label><input id="classCode" name="code" placeholder="예: SAEBOM32" required></div><div class="form-row"><div class="field"><label for="studentNumber">학번</label><input id="studentNumber" name="number" placeholder="예: 1" required inputmode="numeric"></div><div class="field"><label for="studentName">이름</label><input id="studentName" name="name" placeholder="학생 이름" required></div></div><span class="field-hint">학급 코드와 학번은 담임 선생님께 확인해 주세요.</span>`;form.innerHTML=fields+`<div class="error-message hidden" id="loginError"></div><button class="primary-button login-submit" type="submit">${role==='teacher'?'교사 대시보드로':'우리 반 입장하기'}</button><div class="demo-hint">${role==='teacher'?'초기 시연 코드: 2468':`시연 학급 코드: ${esc(data.classCode)} · 명단의 학번과 이름을 사용해 보세요.`}</div>`;form.onsubmit=e=>{e.preventDefault();const fd=new FormData(form);if(role==='teacher'){if(fd.get('code')!==data.teacherCode){showLoginError('입장 코드를 다시 확인해 주세요.');return}data.role='teacher';data.user='담임 선생님'}else{if(fd.get('code').trim().toUpperCase()!==data.classCode.toUpperCase()){showLoginError('학급 접속 코드가 맞는지 확인해 주세요.');return}const student=data.students.find(s=>String(s.number)===fd.get('number').trim()&&s.name===fd.get('name').trim());if(!student){showLoginError('학생 명단에 있는 학번과 이름을 입력해 주세요.');return}data.role=role;data.user=student.name}data.activeSection='알림장';save();render();window.scrollTo({top:0,behavior:'smooth'})}}
const renderLoginFieldsForLearners=renderLoginFields;
renderLoginFields=function(role){if(role!=='admin'){renderLoginFieldsForLearners(role);return}selectedRole='admin';document.querySelectorAll('.tab-button').forEach(button=>button.classList.toggle('active',button.dataset.role==='admin'));const mascot=document.getElementById('loginMascot');if(mascot){mascot.className='login-mascot mascot-admin';mascot.innerHTML='<img src="/ai-images/teacher-mascots.png" alt="학교 관리자 캐릭터" decoding="async"><span><strong>학교 관리자님, 환영합니다!</strong><small>관리자 계정 입장 코드를 입력해 주세요.</small></span>'}const form=document.getElementById('loginForm');if(!form)return;form.innerHTML='<div class="field"><label for="adminCodeLogin">관리자 계정 입장 코드</label><input id="adminCodeLogin" name="code" type="password" placeholder="관리자 코드를 입력해 주세요" required autocomplete="current-password"></div><div class="error-message hidden" id="loginError"></div><button class="primary-button login-submit" type="submit">관리자 설정으로 이동</button><div class="demo-hint">초기 관리자 코드는 1357이며, 관리자 설정에서 변경할 수 있어요.</div>';form.onsubmit=e=>{e.preventDefault();const code=new FormData(form).get('code');if(code!==data.adminCode){showLoginError('관리자 코드를 다시 확인해 주세요.');return}data.role='admin';data.user='학교 관리자';data.activeSection='관리자 설정';save();render();window.scrollTo({top:0,behavior:'smooth'})}}
function classOfficerRoles(number){const names={president:'회장',vicePresident:'부회장',classLeader:'학급 부장'};return Object.entries(data.classOfficers||{}).filter(([,assigned])=>String(assigned)===String(number)).map(([key])=>names[key]).filter(Boolean)}
function isClassOfficer(number){return classOfficerRoles(number).length>0}
const renderLoginFieldsWithAdmin=renderLoginFields;
renderLoginFields=function(role){renderLoginFieldsWithAdmin(role);if(role!=='student'&&role!=='parent')return;const form=document.getElementById('loginForm');if(!form)return;form.onsubmit=e=>{e.preventDefault();const fd=new FormData(form);if(fd.get('code').trim().toUpperCase()!==data.classCode.toUpperCase()){showLoginError('학급 접속 코드가 맞는지 확인해 주세요.');return}const student=data.students.find(s=>String(s.number)===fd.get('number').trim()&&s.name===fd.get('name').trim());if(!student){showLoginError('학생 명단에 있는 학번과 이름을 입력해 주세요.');return}data.role=role;data.user=student.name;data.userNumber=student.number;data.activeSection='알림장';save();render();window.scrollTo({top:0,behavior:'smooth'})}}
function showLoginError(text){const el=document.getElementById('loginError');el.textContent=text;el.classList.remove('hidden')}
function dashboard(){const admin=data.role==='admin';const teacher=data.role==='teacher';const student=data.role==='student';const officer=student&&isClassOfficer(data.userNumber);const title=admin?'학교 관리자님, 안녕하세요!':teacher?`${esc(data.teacherName)}, 환영합니다!`:student?`${esc(data.user)}님, 반가워요!`:`${esc(data.user)} 학생의 보호자님, 반가워요!`;const section=data.activeSection;const today=new Date().toLocaleDateString('ko-KR',{month:'long',day:'numeric',weekday:'long'});const nav=admin?['관리자 설정']:teacher?['알림장','학급 일정','시간표·급식','상담 일정','벌점 현황','학생 명단','학급 임원','수행평가·행사']:['알림장','학급 일정','시간표·급식','벌점 현황','상담 일정','수행평가·행사'];return `<main class="dashboard"><div class="dash-heading"><div><span class="eyebrow"><i class="eyebrow-dot"></i>${admin?'관리자 포털':teacher?'담임교사 대시보드':student?officer?'학급 임원':'학생 공간':'학부모 공간'}</span><h1>${title}</h1><p>${esc(data.className)} · ${esc(data.school)}</p></div><span class="date-label">${today}</span></div>${admin?adminDashboard():teacher?teacherDash(section,nav):familyDash(section,nav)}</main>`}
function adminDashboard(){return `<div class="dash-grid"><section class="panel">${administratorSettingsPanel()}</section><aside class="side-column"><section class="panel"><div class="panel-head"><h2>학급 정보</h2></div><div class="schedule-list"><div class="schedule-item"><span class="schedule-time">학교</span><div><strong>${esc(data.school)}</strong><small>학교 이름</small></div></div><div class="schedule-item"><span class="schedule-time">학급</span><div><strong>${esc(data.className)}</strong><small>${esc(data.teacherName)}</small></div></div></div></section><div class="notice-box"><strong>관리자 전용 설정</strong>여기에서 학교와 학급 정보를 저장하고, 공개 JSON API를 연결할 수 있어요. 실제 여러 기기에서 함께 사용하려면 서버 저장소 연결이 필요합니다.</div></aside></div>`}
function teacherDash(section,nav){return `<div class="stats"><div class="stat"><div class="stat-label">우리 반 학생</div><div class="stat-value">${data.students.length}<small> 명</small></div></div><div class="stat"><div class="stat-label">전달한 알림</div><div class="stat-value">${data.announcements.length}<small> 건</small></div></div><div class="stat"><div class="stat-label">학급 접속 코드</div><div class="stat-value" style="font-size:20px">${esc(data.classCode)}</div></div></div><div class="dash-grid"><section class="panel"><nav class="content-tabs">${nav.map(n=>`<button class="content-tab ${section===n?'active':''}" data-section="${n}">${n}</button>`).join('')}</nav>${section==='알림장'?teacherAnnouncements():section==='학생 명단'?studentRoster():section==='관리자 설정'?settingsPanel():section==='벌점 현황'?penaltyPanel():section==='상담 일정'?consultationPanel():schedulePanel(section)}</section><aside class="side-column"><section class="panel"><div class="panel-head"><h2>오늘의 우리 반</h2><span class="muted">${data.students.length}명 등록</span></div><div class="schedule-list"><div class="schedule-item"><span class="schedule-time">08:50</span><div><strong>아침 인사와 하루 열기</strong><small>교실</small></div></div><div class="schedule-item"><span class="schedule-time">10:00</span><div><strong>수학 · 분수의 크기 비교</strong><small>수학 교과서 준비</small></div></div><div class="schedule-item"><span class="schedule-time">12:10</span><div><strong>점심시간</strong><small>오늘의 급식 확인하기</small></div></div></div></section><section class="panel"><div class="panel-head"><h2>빠른 관리</h2></div><div class="quick-links"><button class="quick-link" data-section="알림장">${svg('bell')} 새 알림 전달<span>대상별 공지 작성</span></button><button class="quick-link" data-section="학생 명단">${svg('users')} 학생 관리<span>명단과 접속 코드</span></button><button class="quick-link" data-section="관리자 설정">${svg('settings')} 환경 설정<span>학교 이름과 API 연결</span></button><button class="quick-link" data-section="학급 일정">${svg('calendar')} 일정 관리<span>학급 일정 살펴보기</span></button></div></section><div class="notice-box"><strong>접속 정보를 안전하게 관리해 주세요</strong>학생·학부모 접속 코드와 개인 정보는 학급 구성원에게만 안내해 주세요.</div></aside></div>`}
function teacherAnnouncements(){const list=data.announcements.filter(a=>data.audienceFilter==='전체'||a.audience==='전체'||a.audience===data.audienceFilter);return `<div class="panel-head"><h2>우리 반 알림장</h2><div class="toolbar"><select id="audienceFilter" class="mini-button" aria-label="알림 대상 필터"><option>전체</option><option>학생</option><option>학부모</option></select><button class="primary-button" data-action="addAnnouncement">${svg('plus')} 새 알림 쓰기</button></div></div><div class="announcement-list">${list.length?list.map(a=>announcementCard(a,true)).join(''):'<div class="empty-state">아직 전달한 알림이 없어요.</div>'}</div>`}
function announcementCard(a,editable=false){const tone=a.audience==='학생'?'blue':a.audience==='학부모'?'pink':'';return `<article class="announcement"><div><h3>${esc(a.title)}</h3><p>${esc(a.body)}</p><div class="announcement-meta"><span>${esc(a.date)}</span><span>·</span><span>${esc(a.category||'알림')}</span><span>·</span><span>${esc(a.audience)} 대상</span></div></div><div style="display:flex;gap:7px;align-items:flex-start"><span class="pill ${tone}">${esc(a.audience)}</span>${editable?`<button class="icon-button" data-delete-announcement="${a.id}" aria-label="알림 삭제">×</button>`:''}</div></article>`}
function studentRoster(){return `<div class="panel-head"><div><h2>학생 명단 및 접속 관리</h2><div class="muted">학생 정보는 이 기기에만 저장됩니다.</div></div><div class="toolbar"><button class="outline-button" data-action="editCodes">접속 코드 변경</button><button class="primary-button" data-action="addStudent">${svg('plus')} 학생 추가</button></div></div><div class="notice-box" style="margin-bottom:14px"><strong>학급 접속 코드: ${esc(data.classCode)}</strong>학생과 학부모는 이 코드와 학번, 학생 이름으로 접속합니다.</div><div class="table-wrap"><table><thead><tr><th>학번</th><th>학생 이름</th><th>벌점</th><th>관리</th></tr></thead><tbody>${data.students.map(s=>`<tr><td>${esc(s.number)}</td><td>${esc(s.name)}</td><td>${data.penalties.find(p=>p.name===s.name)?.count||0}</td><td><button class="icon-button" data-remove-student="${esc(s.number)}" aria-label="학생 삭제">삭제</button></td></tr>`).join('')}</tbody></table></div><p class="field-hint" style="margin-top:12px">학생을 추가하면 학번과 이름으로 접속할 수 있어요. 예시 명단은 자유롭게 수정해 주세요.</p>`}
function classOfficerPanel(){const labels={president:'회장',vicePresident:'부회장',classLeader:'학급 부장'};const select=(key,label)=>`<div class="field"><label for="officer-${key}">${label}</label><select id="officer-${key}" name="${key}"><option value="">아직 지정하지 않음</option>${data.students.map(student=>`<option value="${esc(student.number)}" ${String(data.classOfficers[key])===String(student.number)?'selected':''}>${esc(student.number)}번 · ${esc(student.name)}</option>`).join('')}</select></div>`;return `<div class="panel-head"><div><h2>학급 임원 지정</h2><div class="muted">임원으로 등록된 학생에게 수행평가·행사 자료 등록 권한이 생깁니다.</div></div></div><form id="officersForm" class="form-grid"><div class="settings-grid">${Object.entries(labels).map(([key,label])=>select(key,label)).join('')}</div><div class="toolbar"><button class="primary-button">임원 지정 저장</button></div></form><div class="notice-box" style="margin-top:16px"><strong>임원 자료 등록 안내</strong>회장·부회장·학급 부장은 학생 계정으로 로그인하면 ‘수행평가·행사’에서 자료를 올릴 수 있어요.</div>`}
function materialFeed(){const officer=data.role==='student'&&isClassOfficer(data.userNumber);const canPost=data.role==='teacher'||officer;const posts=data.classMaterials||[];return `<div class="panel-head"><div><h2>수행평가·행사</h2><div class="muted">학급에서 공유한 평가와 행사 안내를 확인하세요.</div></div>${canPost?`<button class="primary-button" data-action="addClassMaterial">자료 올리기</button>`:''}</div>${officer?`<div class="notice-box" style="margin-bottom:14px"><strong>학급 임원 권한: ${classOfficerRoles(data.userNumber).join(' · ')}</strong>과목별 수행평가와 행사 내용을 학급 친구들에게 공유할 수 있어요.</div>`:''}<div class="announcement-list">${posts.length?posts.map(post=>{const mayDelete=data.role==='teacher'||(officer&&String(post.authorNumber)===String(data.userNumber));return `<article class="announcement"><div><h3>${esc(post.title)}</h3><p>${esc(post.body)}</p><div class="announcement-meta"><span>${esc(post.date)}</span><span>·</span><span>${esc(post.kind)}</span><span>·</span><span>${esc(post.subject)}</span><span>·</span><span>${esc(post.author)}</span></div></div><div style="display:flex;gap:7px;align-items:flex-start"><span class="pill ${post.kind==='행사'?'orange':'blue'}">${esc(post.kind)}</span>${mayDelete?`<button class="icon-button" data-delete-material="${post.id}" aria-label="자료 삭제">×</button>`:''}</div></article>`}).join(''):'<div class="empty-state">아직 등록된 수행평가나 행사 안내가 없어요.</div>'}</div>`}
function addClassMaterial(){const roles=classOfficerRoles(data.userNumber);openModal('수행평가·행사 자료 올리기',`<form class="form-grid" id="classMaterialForm"><div class="form-row"><div class="field"><label>자료 종류</label><select name="kind"><option>수행평가</option><option>행사</option></select></div><div class="field"><label>과목 또는 행사 구분</label><select name="subject"><option>국어</option><option>수학</option><option>사회</option><option>과학</option><option>영어</option><option>체육</option><option>음악</option><option>미술</option><option>학급 행사</option><option>학교 행사</option><option>기타</option></select></div></div><div class="field"><label>제목</label><input name="title" required placeholder="예: 수학 분수 단원 수행평가"></div><div class="field"><label>날짜</label><input name="date" type="date" required></div><div class="field"><label>상세 내용</label><textarea name="body" required placeholder="준비물, 범위, 장소 등 친구들에게 필요한 내용을 적어 주세요."></textarea></div><div class="modal-actions"><button type="button" class="outline-button" data-action="closeModal">취소</button><button class="primary-button">학급에 공유하기</button></div></form>`);document.getElementById('classMaterialForm').onsubmit=e=>{e.preventDefault();const fd=new FormData(e.currentTarget);data.classMaterials.unshift({id:Date.now(),kind:fd.get('kind'),subject:fd.get('subject'),title:fd.get('title').trim(),date:fd.get('date'),body:fd.get('body').trim(),author:data.role==='teacher'?data.teacherName:`${data.user} (${roles.join(', ')})`,authorNumber:data.userNumber||null});save();closeModal();render();toast('자료를 학급에 공유했어요.')}}
function settingsPanel(){return `<div class="panel-head"><div><h2>관리자 설정</h2><div class="muted">학교 정보와 일정 연동 주소를 관리합니다.</div></div></div><form class="form-grid" id="settingsForm"><div class="settings-grid"><div class="field"><label>학교 이름</label><input name="school" value="${esc(data.school)}" required></div><div class="field"><label>우리 반 이름</label><input name="className" value="${esc(data.className)}" required></div><div class="field"><label>교사 포털 입장 코드</label><input name="teacherCode" value="${esc(data.teacherCode)}" required></div><div class="field"><label>학급 접속 코드</label><input name="classCode" value="${esc(data.classCode)}" required></div></div><hr style="border:0;border-top:1px solid var(--line);width:100%;margin:5px 0"><div><h3 style="font-size:15px;margin:0 0 3px">일정 API 연결</h3><span class="field-hint">공개적으로 접근 가능한 JSON 주소를 입력하면 화면에서 데이터를 불러옵니다.</span></div><div class="field"><label>학사일정 API 주소</label><input name="academic" value="${esc(data.api.academic)}" placeholder="https://example.com/api/calendar"></div><div class="field"><label>학급 급식일정 API 주소</label><input name="meal" value="${esc(data.api.meal)}" placeholder="https://example.com/api/meals"></div><div class="field"><label>학급 시간표 API 주소</label><input name="timetable" value="${esc(data.api.timetable)}" placeholder="https://example.com/api/timetable"></div><div class="toolbar"><button class="primary-button" type="submit">설정 저장하기</button><button class="outline-button" type="button" data-action="testApis">API 연결 확인</button></div><div class="api-status" id="apiStatus">API 응답은 일정 화면에서 확인할 수 있습니다. API 서버가 브라우저 연결을 허용해야 합니다.</div></form>`}
function administratorSettingsPanel(){return `<div class="panel-head"><div><h2>학교·학급 관리자 설정</h2><div class="muted">기본 정보와 학교 일정 API 주소를 관리합니다.</div></div></div><form class="form-grid" id="adminSettingsForm"><div><h3 style="font-size:15px;margin:0 0 10px">학교와 계정</h3><div class="settings-grid"><div class="field"><label>학교 이름</label><input name="school" value="${esc(data.school)}" required></div><div class="field"><label>학급</label><input name="className" value="${esc(data.className)}" required></div><div class="field"><label>학급 관리 교사명</label><input name="teacherName" value="${esc(data.teacherName)}" required></div><div class="field"><label>교사 포털 입장 코드</label><input name="teacherCode" type="password" value="${esc(data.teacherCode)}" required></div><div class="field"><label>학급 접속 코드</label><input name="classCode" value="${esc(data.classCode)}" required></div><div class="field"><label>관리자 계정 입장 코드</label><input name="adminCode" type="password" value="${esc(data.adminCode)}" required></div></div></div><hr style="border:0;border-top:1px solid var(--line);width:100%;margin:5px 0"><div><h3 style="font-size:15px;margin:0 0 3px">학교 일정 API 연결</h3><span class="field-hint">공개 JSON 주소를 저장한 뒤 연결 확인을 눌러 데이터를 불러오세요. API 서버에서 브라우저 연결(CORS)을 허용해야 합니다.</span></div><div class="field"><label>학교 학사일정 API 주소</label><input name="academic" type="url" value="${esc(data.api.academic)}" placeholder="https://example.com/api/calendar"></div><div class="field"><label>학교 급식 메뉴 API 주소</label><input name="meal" type="url" value="${esc(data.api.meal)}" placeholder="https://example.com/api/meals"></div><div class="field"><label>학급 시간표 API 주소</label><input name="timetable" type="url" value="${esc(data.api.timetable)}" placeholder="https://example.com/api/timetable"></div><div class="toolbar"><button class="primary-button" type="submit">설정 저장하기</button><button class="outline-button" type="button" data-action="testApis">API 연결 확인</button></div><div class="api-status" id="apiStatus">API 주소를 저장하면 학사일정, 급식, 시간표 화면에서 사용할 수 있습니다.</div></form>`}
function penaltyPanel(){return `<div class="panel-head"><div><h2>벌점 현황</h2><div class="muted">학생별 현황을 확인하고 필요할 때 조정해 주세요.</div></div></div><div class="table-wrap"><table><thead><tr><th>학생 이름</th><th>현재 벌점</th><th>조정</th></tr></thead><tbody>${data.students.map(s=>{const p=data.penalties.find(x=>x.name===s.name)||{count:0};return `<tr><td>${esc(s.name)}</td><td>${p.count}점</td><td><div class="toolbar"><button class="icon-button" data-penalty="${esc(s.name)}" data-delta="-1" aria-label="벌점 낮추기">−</button><button class="icon-button" data-penalty="${esc(s.name)}" data-delta="1" aria-label="벌점 올리기">+</button></div></td></tr>`}).join('')}</tbody></table></div><p class="field-hint" style="margin-top:12px">학생과 학부모 계정에는 본인 학생의 벌점만 표시됩니다.</p>`}
function schedulePanel(section){if(section==='시간표·급식')return `<div class="panel-head"><div><h2>시간표와 급식</h2><div class="muted">시간표와 급식 API를 각각 불러올 수 있어요.</div></div></div><div class="side-column"><section><div class="panel-head"><h3 style="margin:0;font-size:15px">오늘의 급식</h3><button class="outline-button" data-action="refreshApi" data-api-key="meal">급식 불러오기</button></div><div class="api-status" id="scheduleResult-meal">${data.api.meal?'급식 API에 연결할 수 있어요.':'관리자 설정에서 급식 API 주소를 추가해 주세요.'}</div><div class="schedule-list" id="scheduleData-meal"></div></section><section><div class="panel-head"><h3 style="margin:0;font-size:15px">학급 시간표</h3><button class="outline-button" data-action="refreshApi" data-api-key="timetable">시간표 불러오기</button></div><div class="api-status" id="scheduleResult-timetable">${data.api.timetable?'시간표 API에 연결할 수 있어요.':'관리자 설정에서 시간표 API 주소를 추가해 주세요.'}</div><div class="schedule-list" id="scheduleData-timetable"></div></section></div>`;const key='academic';return `<div class="panel-head"><div><h2>학교·학급 일정</h2><div class="muted">학사일정 API에서 학교 행사와 일정을 불러옵니다.</div></div><button class="outline-button" data-action="refreshApi" data-api-key="${key}">일정 새로고침</button></div><div class="api-status" id="scheduleResult">${data.api[key]?'일정 API에 연결할 수 있어요.':'관리자 설정에서 학사일정 API 주소를 추가해 주세요.'}</div><div class="schedule-list" id="scheduleData"></div>`}
function consultationPanel(){return `<div class="panel-head"><div><h2>상담 일정</h2><div class="muted">학생과 학부모에게 상담 약속을 안내합니다.</div></div><button class="primary-button" data-action="addConsultation">일정 추가</button></div><div class="announcement-list">${data.consultations.length?data.consultations.map(c=>`<article class="announcement"><div><h3>${esc(c.title)}</h3><p>${esc(c.note||'')}</p><div class="announcement-meta"><span>${esc(c.date)} ${esc(c.time)}</span><span>·</span><span>${esc(c.audience)} 대상</span></div></div><button class="icon-button" data-delete-consultation="${c.id}" aria-label="상담 일정 삭제">×</button></article>`).join(''):'<div class="empty-state">등록된 상담 일정이 없어요.</div>'}</div>`}
function familyConsultations(){const visible=data.consultations.filter(c=>c.audience==='전체'||c.audience===(data.role==='student'?'학생':'학부모'));return `<div class="panel-head"><h2>상담 일정</h2><span class="pill">${visible.length}개 일정</span></div><div class="announcement-list">${visible.length?visible.map(c=>`<article class="announcement"><div><h3>${esc(c.title)}</h3><p>${esc(c.note||'')}</p><div class="announcement-meta"><span>${esc(c.date)} ${esc(c.time)}</span><span>·</span><span>${esc(c.audience)} 대상</span></div></div><span class="pill ${c.audience==='학생'?'blue':'pink'}">${esc(c.audience)}</span></article>`).join(''):'<div class="empty-state">새 상담 일정이 등록되면 이곳에 표시돼요.</div>'}</div>`}
function familyDash(section,nav){const items=data.announcements.filter(a=>a.audience==='전체'||a.audience===(data.role==='student'?'학생':'학부모'));return `<div class="dash-grid"><section class="panel"><nav class="content-tabs">${nav.map(n=>`<button class="content-tab ${section===n?'active':''}" data-section="${n}">${n}</button>`).join('')}</nav>${section==='알림장'?`<div class="panel-head"><h2>선생님이 전해주신 소식</h2><span class="pill">${items.length}개 알림</span></div><div class="announcement-list">${items.length?items.map(a=>announcementCard(a)).join(''):'<div class="empty-state">새 알림이 오면 이곳에 표시돼요.</div>'}</div>`:section==='벌점 현황'?`<div class="panel-head"><h2>나의 벌점 현황</h2></div><div class="stat"><div class="stat-label">${esc(data.user)} 학생</div><div class="stat-value">${data.penalties.find(p=>p.name===data.user)?.count||0}<small> 점</small></div></div><p class="field-hint">벌점 관련 상담이 필요하면 담임 선생님께 문의해 주세요.</p>`:section==='상담 일정'?familyConsultations():schedulePanel(section)}</section><aside class="side-column"><section class="panel"><div class="panel-head"><h2>우리 반 정보</h2></div><div class="schedule-list"><div class="schedule-item"><span class="schedule-time">반</span><div><strong>${esc(data.className)}</strong><small>${esc(data.school)}</small></div></div><div class="schedule-item"><span class="schedule-time">이름</span><div><strong>${esc(data.user)}</strong><small>${data.role==='student'?'학생':'학부모 계정'}</small></div></div><div class="schedule-item"><span class="schedule-time">급식</span><div><strong>오늘의 급식 확인하기</strong><small>연동한 학교 급식 정보</small></div></div></div></section><section class="panel"><div class="panel-head"><h2>빠르게 보기</h2></div><div class="quick-links"><button class="quick-link" data-section="학급 일정">${svg('calendar')} 학사 일정<span>학교 행사와 학급 일정</span></button><button class="quick-link" data-section="시간표·급식">${svg('utensils')} 급식·시간표<span>오늘의 학교생활</span></button></div></section><div class="notice-box"><strong>접속이 필요한가요?</strong>접속 코드나 학생 정보를 잊었다면 담임 선생님께 문의해 주세요.</div></aside></div>`}
const standardTeacherDashboard=teacherDash;
teacherDash=function(section,nav){if(section!=='학급 임원'&&section!=='수행평가·행사')return standardTeacherDashboard(section,nav);return `<div class="stats"><div class="stat"><div class="stat-label">우리 반 학생</div><div class="stat-value">${data.students.length}<small> 명</small></div></div><div class="stat"><div class="stat-label">학급 임원</div><div class="stat-value">${Object.values(data.classOfficers).filter(Boolean).length}<small> 명</small></div></div><div class="stat"><div class="stat-label">공유 자료</div><div class="stat-value">${data.classMaterials.length}<small> 건</small></div></div></div><div class="dash-grid"><section class="panel"><nav class="content-tabs">${nav.map(item=>`<button class="content-tab ${section===item?'active':''}" data-section="${item}">${item}</button>`).join('')}</nav>${section==='학급 임원'?classOfficerPanel():materialFeed()}</section><aside class="side-column"><section class="panel"><div class="panel-head"><h2>임원 자료 관리</h2></div><p class="field-hint">회장·부회장·학급 부장을 지정하면 지정된 학생 계정에만 자료 등록 버튼이 표시됩니다. 교사는 모든 게시물을 확인하고 삭제할 수 있어요.</p></section></aside></div>`};
const standardFamilyDashboard=familyDash;
familyDash=function(section,nav){if(section!=='수행평가·행사')return standardFamilyDashboard(section,nav);return `<section class="panel"><nav class="content-tabs">${nav.map(item=>`<button class="content-tab ${section===item?'active':''}" data-section="${item}">${item}</button>`).join('')}</nav>${materialFeed()}</section>`};
function closeModal(){document.getElementById('modalBackdrop').classList.add('hidden')}
function openModal(title,body){const modal=document.getElementById('modal');modal.innerHTML=`<div class="modal-head"><h2>${title}</h2><button class="icon-button" data-action="closeModal" aria-label="닫기">×</button></div>${body}`;document.getElementById('modalBackdrop').classList.remove('hidden')}
function newAnnouncement(){openModal('새 알림 작성',`<form class="form-grid" id="announcementForm"><div class="field"><label>알림 제목</label><input name="title" required placeholder="예: 다음 주 준비물 안내"></div><div class="form-row"><div class="field"><label>알림 종류</label><select name="category"><option>일반 알림</option><option>학교 행사</option><option>학급 행사</option><option>상담 안내</option></select></div><div class="field"><label>전달 대상</label><select name="audience"><option>전체</option><option>학생</option><option>학부모</option></select></div></div><div class="field"><label>전달 내용</label><textarea name="body" required placeholder="전하고 싶은 내용을 적어 주세요."></textarea></div><div class="modal-actions"><button type="button" class="outline-button" data-action="closeModal">취소</button><button class="primary-button">알림 전달하기</button></div></form>`);document.getElementById('announcementForm').onsubmit=e=>{e.preventDefault();const fd=new FormData(e.currentTarget);data.announcements.unshift({id:Date.now(),title:fd.get('title'),body:fd.get('body'),audience:fd.get('audience'),category:fd.get('category'),date:new Date().toLocaleDateString('ko-KR',{month:'long',day:'numeric'})});save();closeModal();render();toast('알림을 전달했어요.')}}
function addConsultation(){openModal('상담 일정 등록',`<form class="form-grid" id="consultationForm"><div class="field"><label>상담 제목</label><input name="title" required placeholder="예: 2학기 학부모 상담"></div><div class="form-row"><div class="field"><label>날짜</label><input name="date" required placeholder="예: 11월 3일"></div><div class="field"><label>시간</label><input name="time" required type="time" value="15:00"></div></div><div class="form-row"><div class="field"><label>전달 대상</label><select name="audience"><option>학부모</option><option>학생</option><option>전체</option></select></div><div class="field"><label>안내 내용</label><input name="note" placeholder="장소나 준비 사항"></div></div><div class="modal-actions"><button type="button" class="outline-button" data-action="closeModal">취소</button><button class="primary-button">일정 등록</button></div></form>`);document.getElementById('consultationForm').onsubmit=e=>{e.preventDefault();const fd=new FormData(e.currentTarget);data.consultations.unshift({id:Date.now(),title:fd.get('title'),date:fd.get('date'),time:fd.get('time'),audience:fd.get('audience'),note:fd.get('note')});save();closeModal();render();toast('상담 일정을 등록했어요.')}}
function addStudent(){openModal('학생 명단에 추가',`<form class="form-grid" id="studentForm"><div class="form-row"><div class="field"><label>학번</label><input name="number" required inputmode="numeric" placeholder="예: 6"></div><div class="field"><label>학생 이름</label><input name="name" required placeholder="학생 이름"></div></div><div class="modal-actions"><button type="button" class="outline-button" data-action="closeModal">취소</button><button class="primary-button">학생 추가</button></div></form>`);document.getElementById('studentForm').onsubmit=e=>{e.preventDefault();const fd=new FormData(e.currentTarget);if(data.students.some(s=>String(s.number)===fd.get('number').trim())){toast('이미 등록된 학번이에요.');return}data.students.push({number:fd.get('number').trim(),name:fd.get('name').trim()});data.penalties.push({name:fd.get('name').trim(),count:0});save();closeModal();render();toast('학생 명단에 추가했어요.')}}
function editCodes(){openModal('접속 코드 변경',`<form class="form-grid" id="codesForm"><div class="field"><label>새 학급 접속 코드</label><input name="classCode" value="${esc(data.classCode)}" required></div><div class="field"><label>새 교사 포털 입장 코드</label><input name="teacherCode" value="${esc(data.teacherCode)}" required></div><div class="modal-actions"><button type="button" class="outline-button" data-action="closeModal">취소</button><button class="primary-button">코드 저장</button></div></form>`);document.getElementById('codesForm').onsubmit=e=>{e.preventDefault();const fd=new FormData(e.currentTarget);data.classCode=fd.get('classCode').trim();data.teacherCode=fd.get('teacherCode').trim();save();closeModal();render();toast('접속 코드를 변경했어요.')}}
async function fetchApi(key){const url=data.api[key];const result=document.getElementById(`scheduleResult-${key}`)||document.getElementById('scheduleResult')||document.getElementById('apiStatus');if(!url){if(result)result.textContent='먼저 관리자 설정에 API 주소를 입력해 주세요.';return}try{if(result)result.textContent='일정 정보를 불러오는 중이에요...';const response=await fetch(url,{headers:{Accept:'application/json'}});if(!response.ok)throw new Error(`HTTP ${response.status}`);const json=await response.json();const dataTarget=document.getElementById(`scheduleData-${key}`)||document.getElementById('scheduleData');if(dataTarget){const rows=Array.isArray(json)?json:Array.isArray(json.data)?json.data:Array.isArray(json.items)?json.items:[json];dataTarget.innerHTML=rows.slice(0,20).map(item=>`<div class="schedule-item"><span class="schedule-time">${esc(item.date||item.day||'일정')}</span><div><strong>${esc(item.title||item.name||item.meal||'학교 일정')}</strong><small>${esc(item.description||item.time||item.menu||'')}</small></div></div>`).join('')}if(result)result.textContent='연결 성공! 데이터를 불러왔어요.'}catch(err){if(result)result.textContent=`연결할 수 없어요: ${err.message}. 주소가 공개되어 있고 JSON 응답을 제공하는지 확인해 주세요.`}}
document.addEventListener('click',e=>{const target=e.target.closest('button');if(!target)return;if(target.dataset.action==='login')showLogin();if(target.dataset.action==='home'){data.role=null;data.user=null;render();window.scrollTo({top:0,behavior:'smooth'})}if(target.dataset.role){if(!document.getElementById('loginMount')?.innerHTML)showLogin();renderLoginFields(target.dataset.role)}if(target.dataset.action==='logout'){data.role=null;data.user=null;save();render();window.scrollTo({top:0,behavior:'smooth'})}if(target.dataset.section){data.activeSection=target.dataset.section;render()}if(target.dataset.action==='addAnnouncement')newAnnouncement();if(target.dataset.action==='addConsultation')addConsultation();if(target.dataset.action==='addStudent')addStudent();if(target.dataset.action==='editCodes')editCodes();if(target.dataset.action==='closeModal')closeModal();if(target.dataset.deleteAnnouncement){data.announcements=data.announcements.filter(a=>a.id!==Number(target.dataset.deleteAnnouncement));save();render();toast('알림을 삭제했어요.')}if(target.dataset.deleteConsultation){data.consultations=data.consultations.filter(c=>c.id!==Number(target.dataset.deleteConsultation));save();render();toast('상담 일정을 삭제했어요.')}if(target.dataset.removeStudent){data.students=data.students.filter(s=>String(s.number)!==target.dataset.removeStudent);data.penalties=data.penalties.filter(p=>data.students.some(s=>s.name===p.name));save();render();toast('학생을 명단에서 삭제했어요.')}if(target.dataset.penalty){const person=data.penalties.find(p=>p.name===target.dataset.penalty);if(person){person.count=Math.max(0,person.count+Number(target.dataset.delta));save();render()}}if(target.dataset.action==='refreshApi')fetchApi(target.dataset.apiKey);if(target.dataset.action==='testApis'){const first=Object.keys(data.api).find(key=>data.api[key]);if(first)fetchApi(first);else document.getElementById('apiStatus').textContent='확인할 API 주소를 먼저 입력해 주세요.'}});
document.addEventListener('change',e=>{if(e.target.id==='audienceFilter'){data.audienceFilter=e.target.value;render()}});
document.addEventListener('submit',e=>{if(e.target.id==='settingsForm'||e.target.id==='adminSettingsForm'){e.preventDefault();const fd=new FormData(e.target);data.school=fd.get('school').trim();data.className=fd.get('className').trim();data.teacherName=fd.get('teacherName')?.trim()||data.teacherName;data.teacherCode=fd.get('teacherCode').trim();data.classCode=fd.get('classCode').trim();data.adminCode=fd.get('adminCode')?.trim()||data.adminCode;data.api={academic:fd.get('academic').trim(),meal:fd.get('meal').trim(),timetable:fd.get('timetable').trim()};save();render();toast('관리자 설정을 저장했어요.')}});
document.addEventListener('click',e=>{const button=e.target.closest('button');if(!button)return;if(button.dataset.action==='addClassMaterial')addClassMaterial();if(button.dataset.deleteMaterial){data.classMaterials=data.classMaterials.filter(post=>post.id!==Number(button.dataset.deleteMaterial));save();render();toast('학급 자료를 삭제했어요.')}});
document.addEventListener('submit',e=>{if(e.target.id==='officersForm'){e.preventDefault();const form=new FormData(e.target);data.classOfficers={president:form.get('president'),vicePresident:form.get('vicePresident'),classLeader:form.get('classLeader')};save();render();toast('학급 임원을 지정했어요.')}});
render();
</script>
</body>
</html>
